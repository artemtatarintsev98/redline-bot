name: freqtrade-demo
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: freqtrade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      IMG: freqtradeorg/freqtrade:stable_freqai
    steps:
      - uses: actions/checkout@v4
      - name: Probe exchanges
        run: |
          for u in https://api.binance.us/api/v3/ping https://api.binance.com/api/v3/ping https://api.hyperliquid.xyz/info; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' $u)"; done
      - name: Prepare
        run: |
          mkdir -p ft/user_data/strategies
          docker pull -q $IMG
          docker run --rm --entrypoint cat $IMG /freqtrade/freqtrade/templates/FreqaiExampleStrategy.py \
            | sed 's/class FreqaiExampleStrategy/class RedlineFreqAI/; s/can_short = True/can_short = False/' \
            > ft/user_data/strategies/RedlineFreqAI.py
          sudo chmod -R 777 ft
      - name: Run bot (dry-run) and save state
        run: |
          docker run -d --name ft -v $PWD/ft/user_data:/freqtrade/user_data -v $PWD/ft/config.json:/freqtrade/config.json:ro \
            $IMG trade --config /freqtrade/config.json --strategy RedlineFreqAI --freqaimodel LightGBMRegressor \
            --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite --logfile /freqtrade/user_data/freqtrade.log
          git config user.name redline-bot; git config user.email bot@users.noreply.github.com
          save() {
            sudo chmod -R 777 ft/user_data || true
            [ -f ft/user_data/tradesv3.dryrun.sqlite ] && python3 ft/report.py ft/user_data/tradesv3.dryrun.sqlite || true
            tail -c 200000 ft/user_data/freqtrade.log > ft/last_log.txt 2>/dev/null || true
            git add -f ft/user_data/tradesv3.dryrun.sqlite ft/report.md ft/trades.csv ft/last_log.txt 2>/dev/null || true
            git commit -qm "freqtrade state $(date -u +%FT%H:%M)" || true
            git pull -q --rebase --autostash -X theirs || true
            git push -q || true
          }
          end=$(( $(date +%s) + 335*60 ))
          while [ $(date +%s) -lt $end ]; do
            sleep 1200
            if ! docker ps -q -f name=ft | grep -q .; then echo "bot stopped"; docker logs --tail 80 ft; save; break; fi
            save
          done
          docker stop -t 60 ft || true
          save
      - name: Relaunch
        if: ${{ !cancelled() }}
        run: gh workflow run freqtrade.yml --ref main || true
