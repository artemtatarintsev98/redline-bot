name: research-lab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redline-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Compare timeframes and stop widths on real data
        run: python bot/research.py
      - name: Save results
        if: always()
        run: |
          git config user.name "redline-bot"
          git config user.email "redline-bot@users.noreply.github.com"
          git add data/research.json reports/research.md || true
          git diff --cached --quiet || git commit -m "research $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
